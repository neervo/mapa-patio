<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patio YMS - Operador</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: white;
            --text-color: #444;
            --title-color: #003366;
            --input-border: #ccc;
        }

        body.dark-mode {
            --bg-color: #111;
            --card-bg: #222;
            --text-color: #ccc;
            --title-color: #ffcc00;
            --input-border: #555;
        }

        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        
        #mapaFondo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* DISEÑO COMPACTO PARA DEJAR VER EL MAPA */
        .card, .panel-flotante { background-color: var(--card-bg); padding: 15px 20px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; text-align: center; }
        .panel-flotante { position: absolute; bottom: 15px; background-color: rgba(255,255,255,0.95); }
        body.dark-mode .panel-flotante { background-color: rgba(34,34,34,0.95); }

        h2 { color: var(--title-color); margin-top: 0; margin-bottom: 15px; font-size: 20px; }
        
        input { width: 90%; font-size: 16px; border: none; border-bottom: 2px solid var(--input-border); margin-bottom: 15px; padding: 8px; text-align: center; font-weight: bold; background: transparent; color: var(--text-color); outline: none; text-transform: uppercase;}
        
        button { font-size: 15px; font-weight: bold; border: none; border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; color: white; transition: 0.3s; margin-bottom: 8px;}
        .btn-entrar { background-color: #003366; margin-bottom: 0; padding: 12px;}
        .btn-auxilio { background-color: #d32f2f; border-radius: 20px; }
        .btn-salir { background-color: #555; margin-bottom: 0; }
        .btn-entendido { background-color: #2e7d32; margin-top: 10px; }

        .texto-placa { font-size: 18px; font-weight: bold; color: var(--title-color); margin-bottom: 8px; }
        
        /* FILA PARA AHORRAR ESPACIO (Destino y Tiempo juntos) */
        .info-row { display: flex; justify-content: space-around; align-items: center; margin-bottom: 12px; padding: 5px; background: rgba(0,0,0,0.05); border-radius: 8px;}
        body.dark-mode .info-row { background: rgba(255,255,255,0.05); }
        .texto-destino { font-size: 15px; font-weight: bold; color: var(--text-color); }
        .texto-tiempo { font-size: 14px; color: #4caf50; font-weight: bold; }

        /* ALERTA DE MENSAJES COMPACTA */
        #alertaMensaje { display: none; position: absolute; top: 20px; background-color: #ffcc00; padding: 15px; width: 85%; max-width: 350px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; text-align: center; }
        .alerta-titulo { font-size: 14px; font-weight: bold; color: #003366; margin-bottom: 5px; }
        .alerta-texto { font-size: 18px; font-weight: bold; color: #000; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="mapaFondo"></div>

    <div id="alertaMensaje">
        <div class="alerta-titulo">📩 MENSAJE DE TORRE:</div>
        <div id="textoMensaje" class="alerta-texto">"Avanza al G2"</div>
        <button class="btn-entendido" onclick="cerrarMensaje()">✅ ENTENDIDO</button>
    </div>

    <div class="card" id="pantallaLogin">
        <h2>REGISTRO YMS</h2>
        <input type="text" id="placaInput" placeholder="Placa (Ej. TRACTO-5)" oninput="this.value = this.value.toUpperCase()">
        <input type="text" id="posicionInput" placeholder="Posición (Ej. A0 03)" oninput="this.value = this.value.toUpperCase()">
        <button class="btn-entrar" onclick="iniciarRastreo()">Entrar al Patio</button>
    </div>

    <!-- PANEL SÚPER COMPACTO -->
    <div class="panel-flotante" id="pantallaActiva" style="display: none;">
        <div class="texto-placa" id="lblPlaca">UNIDAD: --</div>
        <div class="info-row">
            <div class="texto-destino" id="lblDestino">Destino: --</div>
            <div class="texto-tiempo" id="lblTiempo">⏱️ 0 min</div>
        </div>
        <button class="btn-auxilio" onclick="pedirAuxilio()">🚨 AUXILIO VIAL</button>
        <button class="btn-salir" onclick="salirRastreo()">Cerrar Viaje Manual</button>
    </div>

    <script>
        const horaActual = new Date().getHours();
        if (horaActual >= 18 || horaActual < 6) { document.body.classList.add('dark-mode'); }

        const firebaseConfig = { apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE", authDomain: "patio-densidad.firebaseapp.com", databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com", projectId: "patio-densidad" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const coordenadasBahias = { "A0 02": [19.0671, -104.2955], "A0 06": [19.0650, -104.2940], "G3 02": [19.0665, -104.2960] };
        
        let mapa, marcadorDestino, marcadorMia;
        let watchId = null;
        let placaGlobal = "";
        let destinoGlobal = "";
        let horaIngreso = 0;
        let timerInterval = null;
        let ultimoAudio = 0;
        let wakeLock = null;
        let maxSpeed = 0;

        mapa = L.map('mapaFondo', { zoomControl: false }).setView([19.066, -104.295], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mapa);

        async function solicitarWakeLock() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) { console.log("Wake Lock falló", err); }
        }

        function hablar(texto) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(texto);
                utterance.lang = 'es-MX';
                window.speechSynthesis.speak(utterance);
            }
        }

        function cerrarMensaje() {
            document.getElementById('alertaMensaje').style.display = 'none';
        }

        function iniciarRastreo() {
            const placa = document.getElementById('placaInput').value.trim();
            const posicion = document.getElementById('posicionInput').value.trim();

            if (placa === "" || posicion === "") { alert("Faltan datos."); return; }

            let partes = posicion.split(" ");
            let destino = posicion;
            if (partes.length >= 2) {
                let bloque = partes[0];
                let num = parseInt(partes[1], 10);
                if (num % 2 !== 0) { if ((num + 1) % 4 === 0) num -= 1; else num += 1; }
                destino = bloque + " " + num.toString().padStart(2, '0');
            }

            placaGlobal = placa;
            destinoGlobal = destino;
            horaIngreso = Date.now();
            maxSpeed = 0;

            document.getElementById('lblPlaca').innerText = "UNIDAD: " + placaGlobal;
            document.getElementById('lblDestino').innerText = destinoGlobal;
            
            document.getElementById('pantallaLogin').style.display = 'none';
            document.getElementById('pantallaActiva').style.display = 'block';

            solicitarWakeLock();
            hablar("Ruta iniciada");

            timerInterval = setInterval(() => {
                let min = Math.floor((Date.now() - horaIngreso) / 60000);
                document.getElementById('lblTiempo').innerText = "⏱️ " + min + " min";
            }, 60000);

            db.ref('camiones_en_patio/' + placaGlobal).on('value', snap => {
                const data = snap.val();
                if (data && data.tts_mensaje && data.tts_timestamp > ultimoAudio) {
                    ultimoAudio = data.tts_timestamp;
                    document.getElementById('textoMensaje').innerText = `"${data.tts_mensaje}"`;
                    document.getElementById('alertaMensaje').style.display = 'block';
                    hablar(data.tts_mensaje);
                }
            });

            if (coordenadasBahias[destinoGlobal]) {
                if (marcadorDestino) mapa.removeLayer(marcadorDestino);
                marcadorDestino = L.marker(coordenadasBahias[destinoGlobal]).addTo(mapa).bindPopup("Destino: " + destinoGlobal);
            }

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    let speed = pos.coords.speed || 0; 
                    let speedKmh = (speed * 3.6).toFixed(1);
                    
                    if (parseFloat(speedKmh) > parseFloat(maxSpeed)) maxSpeed = speedKmh;

                    if (marcadorMia) {
                        marcadorMia.setLatLng([lat, lng]);
                    } else {
                        marcadorMia = L.circleMarker([lat, lng], { radius: 8, fillColor: "#007AFF", color: "white", weight: 2, fillOpacity: 1 }).addTo(mapa);
                    }
                    mapa.setView([lat, lng], 18);

                    db.ref('camiones_en_patio/' + placaGlobal).update({
                        lat: lat, lng: lng, placa: placaGlobal, destino: destinoGlobal,
                        hora_ingreso: horaIngreso, velocidad_actual: speedKmh, velocidad_maxima: maxSpeed
                    });

                }, err => { alert("Error de GPS: Asegúrate de dar permisos de ubicación."); }, 
                { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        function salirRastreo() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (timerInterval) clearInterval(timerInterval);
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
            
            if (placaGlobal !== "") {
                db.ref('historial_viajes').push({
                    placa: placaGlobal, destino: destinoGlobal, hora_ingreso: horaIngreso, 
                    hora_salida: Date.now(), velocidad_maxima: maxSpeed
                });
                db.ref('camiones_en_patio/' + placaGlobal).remove();
                db.ref('camiones_en_patio/' + placaGlobal).off(); 
            }

            document.getElementById('pantallaLogin').style.display = 'block';
            document.getElementById('pantallaActiva').style.display = 'none';
            document.getElementById('alertaMensaje').style.display = 'none';
            document.getElementById('placaInput').value = "";
            document.getElementById('posicionInput').value = "";
            document.getElementById('lblTiempo').innerText = "⏱️ 0 min";
            
            if (marcadorMia) mapa.removeLayer(marcadorMia); marcadorMia = null;
            if (marcadorDestino) mapa.removeLayer(marcadorDestino); marcadorDestino = null;
            
            placaGlobal = "";
        }

        function pedirAuxilio() {
            if (confirm("¿Seguro que deseas pedir AUXILIO VIAL? Se alertará a la Torre.")) {
                db.ref('camiones_en_patio/' + placaGlobal).update({ estado: 'emergencia' });
                const msg = `🚨 EMERGENCIA EN PATIO: La unidad ${placaGlobal} pide Auxilio.`;
                fetch(`https://api.telegram.org/bot8515273340:AAHsV3fsue-dY9CZCWlj1izG-usRtgDY64k/sendMessage?chat_id=-1005100426684&text=${encodeURIComponent(msg)}`);
            }
        }
    </script>
</body>
</html>
