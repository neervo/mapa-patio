<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Patio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #mapa { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .panel-flotante {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; width: 90%; max-width: 350px;
            text-align: center; backdrop-filter: blur(5px);
        }
        input { font-size: 20px; padding: 10px; width: 90%; text-transform: uppercase; text-align: center; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
        
        .btn { font-size: 16px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-entrar { background-color: #003366; color: white; }
        .btn-salir { background-color: #555; color: white; }
        .btn-emergencia { background-color: #d32f2f; color: white; display: none; }
        
        .info-placa { font-size: 18px; font-weight: bold; color: #003366; margin-bottom: 5px; display: none; }
        .tiempo-estadía { font-size: 14px; font-weight: bold; color: #4caf50; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <div class="panel-flotante">
        <div id="vista-login">
            <input type="text" id="placa" placeholder="Placa del Tracto" required>
            <button class="btn btn-entrar" onclick="iniciarRastreo()">Entrar al Patio</button>
        </div>

        <div id="vista-activa">
            <div id="texto-placa" class="info-placa"></div>
            <div id="cronometro" class="tiempo-estadía">⏱️ Tiempo en terminal: 0 min</div>
            <button id="btnEmergencia" class="btn btn-emergencia" onclick="pedirAuxilio()">🚨 AUXILIO VIAL</button>
            <button id="btnSalir" class="btn btn-salir" style="display:none;" onclick="salirRastreo()">Cerrar Viaje Manual</button>
        </div>
    </div>

    <script>
        const mapa = L.map('mapa', { zoomControl: false }).setView([19.066, -104.295], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);
        let marcadorPropio = null;

        const firebaseConfig = {
            apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE",
            authDomain: "patio-densidad.firebaseapp.com",
            databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com",
            projectId: "patio-densidad"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let placaActual = "";
        let ultimoAudioReproducido = 0;
        let horaIngreso = 0;
        let intervaloCronometro = null;
        
        // Coordenadas centrales de tu patio para la GEOCERCA
        const CENTRO_PATIO = L.latLng(19.066, -104.295); 
        const RADIO_GEOCERCA_METROS = 4000; // Si se aleja 500m, se sale automáticamente

        function iniciarRastreo() {
            placaActual = document.getElementById("placa").value.trim().toUpperCase();
            if (placaActual === "") { alert("Por favor, ingresa tu placa."); return; }

            const vozDesbloqueo = new SpeechSynthesisUtterance("Ruta iniciada");
            vozDesbloqueo.lang = 'es-MX';
            window.speechSynthesis.speak(vozDesbloqueo);

            if (navigator.geolocation) {
                horaIngreso = Date.now();
                
                document.getElementById("vista-login").style.display = "none";
                document.getElementById("texto-placa").innerText = "UNIDAD: " + placaActual;
                document.getElementById("texto-placa").style.display = "block";
                document.getElementById("cronometro").style.display = "block";
                document.getElementById("btnEmergencia").style.display = "block";
                // Dejamos el manual oculto o visible (opcional), lo mostramos por si la geocerca falla
                document.getElementById("btnSalir").style.display = "block"; 
                
                db.ref('camiones_en_patio/' + placaActual).onDisconnect().remove();
                
                // Iniciar el cronómetro visual
                intervaloCronometro = setInterval(() => {
                    let minutos = Math.floor((Date.now() - horaIngreso) / 60000);
                    document.getElementById("cronometro").innerText = `⏱️ Tiempo en terminal: ${minutos} min`;
                }, 60000); // Actualiza cada minuto
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const ubicacionActual = L.latLng(lat, lng);
                        
                        // LÓGICA DE GEOCERCA AUTOMÁTICA
                        const distancia = CENTRO_PATIO.distanceTo(ubicacionActual);
                        if (distancia > RADIO_GEOCERCA_METROS) {
                            alert("Has salido del perímetro de la terminal. Viaje finalizado automáticamente.");
                            salirRastreo();
                            return; // Detiene el código aquí
                        }
                        
                        // Si sigue adentro, actualiza Firebase
                        db.ref('camiones_en_patio/' + placaActual).update({ 
                            lat: lat, 
                            lng: lng, 
                            placa: placaActual,
                            hora_ingreso: horaIngreso // Mandamos la hora a la torre
                        });

                        mapa.setView([lat, lng], 18);
                        if (marcadorPropio) { marcadorPropio.setLatLng([lat, lng]); } 
                        else { marcadorPropio = L.marker([lat, lng]).addTo(mapa); }
                        
                        escucharRadio();
                    },
                    (error) => { alert("Error de GPS. Verifica tu ubicación."); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else { alert("GPS no soportado en este navegador."); }
        }

        function escucharRadio() {
            db.ref('camiones_en_patio/' + placaActual).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.tts_mensaje && data.tts_timestamp > ultimoAudioReproducido) {
                    ultimoAudioReproducido = data.tts_timestamp;
                    const mensaje = new SpeechSynthesisUtterance(data.tts_mensaje);
                    mensaje.lang = 'es-MX'; 
                    mensaje.rate = 1.0;
                    mensaje.volume = 1.0;
                    window.speechSynthesis.speak(mensaje);
                }
            });
        }

        function salirRastreo() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (intervaloCronometro !== null) clearInterval(intervaloCronometro);
            
            db.ref('camiones_en_patio/' + placaActual).onDisconnect().cancel();
            db.ref('camiones_en_patio/' + placaActual).remove();
            
            if (marcadorPropio) { mapa.removeLayer(marcadorPropio); marcadorPropio = null; }
            
            document.getElementById("vista-login").style.display = "block";
            document.getElementById("placa").value = "";
            document.getElementById("texto-placa").style.display = "none";
            document.getElementById("cronometro").style.display = "none";
            document.getElementById("cronometro").innerText = "⏱️ Tiempo en terminal: 0 min";
            document.getElementById("btnEmergencia").style.display = "none";
            document.getElementById("btnSalir").style.display = "none";
            
            placaActual = "";
        }

        function pedirAuxilio() {
            if (placaActual !== "") {
                const confirmar = confirm("¿Estás seguro de solicitar AUXILIO VIAL? Se alertará a la Torre de Control inmediatamente.");
                if (confirmar) {
                    // 1. Avisar a la Torre de Control en Firebase
                    db.ref('camiones_en_patio/' + placaActual).update({ estado: 'emergencia' });
                    
                    // 2. DISPARAR ALERTA A TELEGRAM
                    // ¡OJO! REEMPLAZA ESTOS DATOS CON TUS CREDENCIALES REALES
                    const token = "TU_TOKEN_DE_TELEGRAM_AQUI"; 
                    const chat_id = "TU_CHAT_ID_AQUI"; 
                    const textoMsg = `🚨 EMERGENCIA EN PATIO: La unidad ${placaActual} acaba de presionar el botón de Auxilio Vial.`;
                    
                    const urlTelegram = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(textoMsg)}`;
                    
                    fetch(urlTelegram)
                        .then(response => console.log("Telegram enviado"))
                        .catch(error => console.error("Error Telegram:", error));
                }
            }
        }

        window.addEventListener("beforeunload", function (e) {
            if (placaActual !== "") db.ref('camiones_en_patio/' + placaActual).remove();
        });
    </script>
</body>
</html>
