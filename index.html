<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Patio</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        input { font-size: 24px; padding: 10px; width: 80%; text-transform: uppercase; text-align: center; border: 2px solid #ccc; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        button { font-size: 18px; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-entrar { background-color: #003366; color: white; }
        .btn-entrar:hover { background-color: #001f4d; }
        .btn-emergencia { background-color: #d32f2f; color: white; border-radius: 50px; padding: 25px 20px; font-size: 20px; margin-top: 30px; display: none; box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4); }
        #estado { margin-top: 20px; font-size: 18px; color: #555; }
        .radio-alerta { display: none; background-color: #ff9800; color: white; padding: 10px; border-radius: 5px; margin-top: 20px; font-weight: bold; animation: parpadeo 1s infinite; }
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="tituloPantalla">REGISTRO DE PATIO</h2>
        <input type="text" id="placa" placeholder="EJ: ABC-123" required>
        <button id="btnAcción" class="btn-entrar" onclick="iniciarRastreo()">Entrar a Patio</button>
        <div id="estado">Esperando ingreso...</div>
        
        <!-- Letrero que sale cuando el monitorista está hablando -->
        <div id="alertaRadio" class="radio-alerta">🔊 Recibiendo mensaje de Torre...</div>

        <button id="btnEmergencia" class="btn-emergencia" onclick="pedirAuxilio()">🚨 AUXILIO VIAL 🚨</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE",
            authDomain: "patio-densidad.firebaseapp.com",
            databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com",
            projectId: "patio-densidad"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let placaActual = "";
        let ultimoAudioReproducido = 0; // Para no repetir audios viejos

        function iniciarRastreo() {
            placaActual = document.getElementById("placa").value.trim().toUpperCase();
            if (placaActual === "") { alert("Por favor, ingresa tus placas."); return; }

            if (navigator.geolocation) {
                document.getElementById("estado").innerText = "Conectando al radar...";
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // Solo actualiza posición, no borra el estado de emergencia ni el audio
                        db.ref('camiones_en_patio/' + placaActual).update({
                            lat: lat,
                            lng: lng,
                            placa: placaActual
                        });

                        document.getElementById("estado").innerHTML = `<b>Radar Activo:</b><br>Transmitiendo ubicación...`;
                        document.getElementById("placa").style.display = "none";
                        document.getElementById("tituloPantalla").innerText = placaActual;
                        
                        const btnAccion = document.getElementById("btnAcción");
                        btnAccion.innerText = "Salir del Patio";
                        btnAccion.style.backgroundColor = "#555";
                        btnAccion.onclick = salirRastreo;

                        document.getElementById("btnEmergencia").style.display = "block";
                        
                        // Empezar a escuchar instrucciones de voz
                        escucharRadio();
                    },
                    (error) => {
                        document.getElementById("estado").innerText = "Error de GPS. Enciende tu ubicación.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                alert("Tu navegador no soporta GPS.");
            }
        }

        // FUNCIÓN MÁGICA: Escuchar la radio
        function escucharRadio() {
            db.ref('camiones_en_patio/' + placaActual).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.audio_mensaje && data.audio_timestamp > ultimoAudioReproducido) {
                    // Hay un mensaje de voz nuevo de la torre
                    ultimoAudioReproducido = data.audio_timestamp;
                    
                    const alertaVisual = document.getElementById("alertaRadio");
                    alertaVisual.style.display = "block"; // Mostrar letrero
                    
                    const reproductor = new Audio(data.audio_mensaje);
                    reproductor.play().catch(e => console.log("Navegador bloqueó el auto-play"));
                    
                    reproductor.onended = () => {
                        alertaVisual.style.display = "none"; // Ocultar letrero al terminar
                    };
                }
            });
        }

        function salirRastreo() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); }
            db.ref('camiones_en_patio/' + placaActual).remove();
            
            document.getElementById("estado").innerText = "Viaje finalizado. Estás fuera del radar.";
            document.getElementById("btnAcción").innerText = "Entrar a Patio";
            document.getElementById("btnAcción").style.backgroundColor = "#003366";
            document.getElementById("btnAcción").onclick = iniciarRastreo;
            document.getElementById("placa").style.display = "block";
            document.getElementById("placa").value = "";
            document.getElementById("tituloPantalla").innerText = "REGISTRO DE PATIO";
            document.getElementById("btnEmergencia").style.display = "none";
            document.getElementById("alertaRadio").style.display = "none";
            
            placaActual = "";
        }

        function pedirAuxilio() {
            if (placaActual !== "") {
                db.ref('camiones_en_patio/' + placaActual).update({ estado: 'emergencia' });
                alert("🚨 Alerta enviada a la Torre de Control. Espera instrucciones por radio.");
            }
        }

        // Si el operador cierra la pestaña, borramos el camión
        window.addEventListener("beforeunload", function (e) {
            if (placaActual !== "") { db.ref('camiones_en_patio/' + placaActual).remove(); }
        });
    </script>
</body>
</html>
