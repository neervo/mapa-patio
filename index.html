<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Patio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #mapa { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .panel-flotante { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; width: 90%; max-width: 350px; text-align: center; backdrop-filter: blur(5px); }
        input { font-size: 20px; padding: 10px; width: 90%; text-transform: uppercase; text-align: center; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
        
        .btn { font-size: 16px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-entrar { background-color: #003366; color: white; }
        .btn-salir { background-color: #555; color: white; }
        .btn-emergencia { background-color: #d32f2f; color: white; display: none; }
        
        .info-placa { font-size: 18px; font-weight: bold; color: #003366; margin-bottom: 5px; display: none; }
        .tiempo-estadía { font-size: 14px; font-weight: bold; color: #4caf50; margin-bottom: 15px; display: none; }
        .icono-destino { font-size: 35px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="mapa"></div>

    <div class="panel-flotante">
        <div id="vista-login">
            <input type="text" id="placa" placeholder="Placa (Ej. TRACTO-5)" required>
            <input type="text" id="posicion" placeholder="Posición (Ej. A0 03 01)" required>
            <button class="btn btn-entrar" onclick="iniciarRastreo()">Entrar al Patio</button>
        </div>

        <div id="vista-activa">
            <div id="texto-placa" class="info-placa"></div>
            <div id="cronometro" class="tiempo-estadía">⏱️ Tiempo en terminal: 0 min</div>
            <button id="btnEmergencia" class="btn btn-emergencia" onclick="pedirAuxilio()">🚨 AUXILIO VIAL</button>
            <button id="btnSalir" class="btn btn-salir" style="display:none;" onclick="salirRastreo()">Cerrar Viaje Manual</button>
        </div>
    </div>

    <script>
        const mapa = L.map('mapa', { zoomControl: false }).setView([19.066, -104.295], 16);
        
        // Vista Satelital y Calles
        const capaCalles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        capaSatelite.addTo(mapa);
        L.control.layers({"Satelital": capaSatelite, "Calles": capaCalles}).addTo(mapa);
        
        let marcadorPropio = null;
        let marcadorDestino = null;

        const firebaseConfig = {
            apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE",
            authDomain: "patio-densidad.firebaseapp.com",
            databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com",
            projectId: "patio-densidad"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchId = null;
        let placaActual = "";
        let ultimoAudioReproducido = 0;
        let horaIngreso = 0;
        let intervaloCronometro = null;
        
// ========================================================
        // GEOCERCA POLIGONAL INVISIBLE (Solo matemática)
        // ========================================================
        const COORDENADAS_POLIGONO = [
            [19.070, -104.300], // Pega aquí tu Esquina 1
            [19.070, -104.290], // Pega aquí tu Esquina 2
            [19.060, -104.290], // Pega aquí tu Esquina 3
            [19.060, -104.300]  // Pega aquí tu Esquina 4
        ];

        // Ya NO dibujamos la línea aquí. Pasamos directo al cálculo:
        
        function estaAdentroDelPatio(lat, lng, poligono) {
            let adentro = false;
            for (let i = 0, j = poligono.length - 1; i < poligono.length; j = i++) {
                let xi = poligono[i][0], yi = poligono[i][1];
                let xj = poligono[j][0], yj = poligono[j][1];
                let intersecta = ((yi > lng) != (yj > lng)) && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi);
                if (intersecta) adentro = !adentro;
            }
            return true; // Recuerda cambiar esto a 'return adentro;' cuando vayas a probar al puerto real
        }

        const coordenadasBahias = {
            "A0 02": [19.0671, -104.2955],
            "A0 06": [19.0650, -104.2940],
            "G3 02": [19.0665, -104.2960]
        };

        function iniciarRastreo() {
            placaActual = document.getElementById("placa").value.trim().toUpperCase();
            let posicionCompleta = document.getElementById("posicion").value.trim().toUpperCase();
            
            if (placaActual === "" || posicionCompleta === "") { alert("Ingresa tu placa y la posición del ticket."); return; }

            const vozDesbloqueo = new SpeechSynthesisUtterance("Ruta iniciada");
            vozDesbloqueo.lang = 'es-MX';
            window.speechSynthesis.speak(vozDesbloqueo);

            let partesPosicion = posicionCompleta.split(" ");
            let claveBahia = "";
            
            if (partesPosicion.length >= 2) {
                let bloque = partesPosicion[0];
                let bahiaNumero = parseInt(partesPosicion[1], 10);
                if (bahiaNumero % 2 !== 0) {
                    if ((bahiaNumero + 1) % 4 === 0) { bahiaNumero = bahiaNumero - 1; } 
                    else { bahiaNumero = bahiaNumero + 1; }
                }
                let bahiaFormateada = bahiaNumero.toString().padStart(2, '0');
                claveBahia = bloque + " " + bahiaFormateada; 
            } else {
                claveBahia = posicionCompleta;
            }

            if (coordenadasBahias[claveBahia]) {
                const iconoBandera = L.divIcon({ html: '🏁', className: 'icono-destino', iconSize: [35, 35], iconAnchor: [17, 35] });
                marcadorDestino = L.marker(coordenadasBahias[claveBahia], {icon: iconoBandera}).addTo(mapa);
                marcadorDestino.bindPopup("<b>Destino:</b> " + claveBahia).openPopup();
            }

            if (navigator.geolocation) {
                horaIngreso = Date.now();
                document.getElementById("vista-login").style.display = "none";
                document.getElementById("texto-placa").innerText = "UNIDAD: " + placaActual + " ➔ " + claveBahia;
                document.getElementById("texto-placa").style.display = "block";
                document.getElementById("cronometro").style.display = "block";
                document.getElementById("btnEmergencia").style.display = "block";
                document.getElementById("btnSalir").style.display = "block"; 
                
                db.ref('camiones_en_patio/' + placaActual).onDisconnect().remove();
                
                intervaloCronometro = setInterval(() => {
                    let minutos = Math.floor((Date.now() - horaIngreso) / 60000);
                    document.getElementById("cronometro").innerText = `⏱️ Tiempo en terminal: ${minutos} min`;
                }, 60000);
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // LÓGICA DE GEOCERCA POLIGONAL
                        if (!estaAdentroDelPatio(lat, lng, COORDENADAS_POLIGONO)) {
                            alert("Has salido de la terminal. Viaje finalizado.");
                            salirRastreo();
                            return; 
                        }
                        
                        db.ref('camiones_en_patio/' + placaActual).update({ lat: lat, lng: lng, placa: placaActual, hora_ingreso: horaIngreso, destino: claveBahia });

                        if (marcadorPropio) { marcadorPropio.setLatLng([lat, lng]); } 
                        else { marcadorPropio = L.marker([lat, lng]).addTo(mapa); }

                        if (marcadorDestino) {
                            const grupo = new L.featureGroup([marcadorPropio, marcadorDestino]);
                            mapa.fitBounds(grupo.getBounds(), { padding: [50, 50], maxZoom: 18 });
                        } else {
                            mapa.setView([lat, lng], 18);
                        }
                        
                        escucharRadio();
                    },
                    (error) => { alert("Error de GPS."); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else { alert("GPS no soportado."); }
        }

        function escucharRadio() {
            db.ref('camiones_en_patio/' + placaActual).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.tts_mensaje && data.tts_timestamp > ultimoAudioReproducido) {
                    ultimoAudioReproducido = data.tts_timestamp;
                    const mensaje = new SpeechSynthesisUtterance(data.tts_mensaje);
                    mensaje.lang = 'es-MX'; 
                    mensaje.rate = 1.0;
                    window.speechSynthesis.speak(mensaje);
                }
            });
        }

        function salirRastreo() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (intervaloCronometro !== null) clearInterval(intervaloCronometro);
            
            db.ref('camiones_en_patio/' + placaActual).onDisconnect().cancel();
            db.ref('camiones_en_patio/' + placaActual).remove();
            
            if (marcadorPropio) { mapa.removeLayer(marcadorPropio); marcadorPropio = null; }
            if (marcadorDestino) { mapa.removeLayer(marcadorDestino); marcadorDestino = null; }
            
            document.getElementById("vista-login").style.display = "block";
            document.getElementById("placa").value = "";
            document.getElementById("posicion").value = "";
            document.getElementById("texto-placa").style.display = "none";
            document.getElementById("cronometro").style.display = "none";
            document.getElementById("cronometro").innerText = "⏱️ Tiempo en terminal: 0 min";
            document.getElementById("btnEmergencia").style.display = "none";
            document.getElementById("btnSalir").style.display = "none";
            
            placaActual = "";
        }

        function pedirAuxilio() {
            if (placaActual !== "") {
                if (confirm("¿Solicitar AUXILIO VIAL? Se alertará a la Torre inmediatamente.")) {
                    db.ref('camiones_en_patio/' + placaActual).update({ estado: 'emergencia' });
                    
                    const token = "8515273340:AAHsV3fsue-dY9CZCWlj1izG-usRtgDY64k"; 
                    const chat_id = "-1005100426684"; 
                    const textoMsg = `🚨 EMERGENCIA EN PATIO: La unidad ${placaActual} acaba de presionar el botón de Auxilio Vial.`;
                    
                    fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(textoMsg)}`)
                        .catch(error => console.error(error));
                }
            }
        }

        window.addEventListener("beforeunload", function (e) {
            if (placaActual !== "") db.ref('camiones_en_patio/' + placaActual).remove();
        });
    </script>
</body>
</html>
