        .panel-flotante {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; width: 90%; max-width: 350px;

        }

        .btn { font-size: 16px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-entrar { background-color: #003366; color: white; }
        .btn-salir { background-color: #555; color: white; }
        .btn-emergencia { background-color: #d32f2f; color: white; display: none; }
        
        .info-placa { font-size: 18px; font-weight: bold; color: #003366; margin-bottom: 5px; display: none; }
        .tiempo-estadía { font-size: 14px; font-weight: bold; color: #4caf50; margin-bottom: 15px; display: none; }
        
        .icono-destino { font-size: 35px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>

        function iniciarRastreo() {
            placaActual = document.getElementById("placa").value.trim().toUpperCase();
            let posicionCompleta = document.getElementById("posicion").value.trim().toUpperCase();
            
            if (placaActual === "" || posicionCompleta === "") { alert("Ingresa tu placa y la posición del ticket."); return; }

            const vozDesbloqueo = new SpeechSynthesisUtterance("Ruta iniciada");
            vozDesbloqueo.lang = 'es-MX';
            window.speechSynthesis.speak(vozDesbloqueo);

            // ==========================================================
            // LÓGICA INTELIGENTE: EXTRAER BLOQUE Y CONVERTIR IMPAR A PAR
            // ==========================================================
            let partesPosicion = posicionCompleta.split(" ");
            let claveBahia = "";
            
            if (partesPosicion.length >= 2) {
                let bloque = partesPosicion[0]; // Ej. "A0"
                let bahiaNumero = parseInt(partesPosicion[1], 10); // Ej. 3
                
                // Si es un número impar (contenedor 20 pies)
                if (bahiaNumero % 2 !== 0) {
                    if ((bahiaNumero + 1) % 4 === 0) {
                        bahiaNumero = bahiaNumero - 1; // Ej. Si es 3, cambia a 2. Si es 7, cambia a 6.
                    } else {
                        bahiaNumero = bahiaNumero + 1; // Ej. Si es 1, cambia a 2. Si es 5, cambia a 6.
                    }
                }

                // Asegurar que la bahía tenga 2 dígitos (Ej. convertir "2" en "02")
                let bahiaFormateada = bahiaNumero.toString().padStart(2, '0');
                claveBahia = bloque + " " + bahiaFormateada; // Resultado final: "A0 02"
            } else {
                claveBahia = posicionCompleta;
            }

            // DIBUJAR DESTINO EN EL MAPA SI EXISTE EN EL DICCIONARIO
            if (coordenadasBahias[claveBahia]) {
                const iconoBandera = L.divIcon({ html: '🏁', className: 'icono-destino', iconSize: [35, 35], iconAnchor: [17, 35] });
                marcadorDestino = L.marker(coordenadasBahias[claveBahia], {icon: iconoBandera}).addTo(mapa);
                marcadorDestino.bindPopup("<b>Destino:</b> " + claveBahia).openPopup();
            }

            if (navigator.geolocation) {
                horaIngreso = Date.now();
                document.getElementById("vista-login").style.display = "none";
                document.getElementById("texto-placa").innerText = "UNIDAD: " + placaActual + " ➔ " + claveBahia;
                document.getElementById("texto-placa").style.display = "block";
                document.getElementById("cronometro").style.display = "block";
                document.getElementById("btnEmergencia").style.display = "block";
                document.getElementById("btnSalir").style.display = "block"; 
                
                db.ref('camiones_en_patio/' + placaActual).onDisconnect().remove();
                
                intervaloCronometro = setInterval(() => {
                    let minutos = Math.floor((Date.now() - horaIngreso) / 60000);
                    document.getElementById("cronometro").innerText = `⏱️ Tiempo en terminal: ${minutos} min`;
                }, 60000);
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const ubicacionActual = L.latLng(lat, lng);
                        
                        if (CENTRO_PATIO.distanceTo(ubicacionActual) > RADIO_GEOCERCA_METROS) {
                            alert("Has salido de la terminal. Viaje finalizado.");
                            salirRastreo();
                            return; 
                        }
                        
                        db.ref('camiones_en_patio/' + placaActual).update({ lat: lat, lng: lng, placa: placaActual, hora_ingreso: horaIngreso, destino: claveBahia });

                        if (marcadorPropio) { marcadorPropio.setLatLng([lat, lng]); } 
                        else { marcadorPropio = L.marker([lat, lng]).addTo(mapa); }

                        if (marcadorDestino) {
                            const grupo = new L.featureGroup([marcadorPropio, marcadorDestino]);
                            mapa.fitBounds(grupo.getBounds(), { padding: [50, 50], maxZoom: 18 });
                        } else {
                            mapa.setView([lat, lng], 18);
                        }
                        
                        escucharRadio();
                    },
                    (error) => { alert("Error de GPS."); },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else { alert("GPS no soportado."); }
        }

        function escucharRadio() {
            db.ref('camiones_en_patio/' + placaActual).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.tts_mensaje && data.tts_timestamp > ultimoAudioReproducido) {
                    ultimoAudioReproducido = data.tts_timestamp;
                    const mensaje = new SpeechSynthesisUtterance(data.tts_mensaje);
                    mensaje.lang = 'es-MX'; 
                    mensaje.rate = 1.0;
                    window.speechSynthesis.speak(mensaje);
                }
            });
        }

        function salirRastreo() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (intervaloCronometro !== null) clearInterval(intervaloCronometro);
            
            db.ref('camiones_en_patio/' + placaActual).onDisconnect().cancel();
            db.ref('camiones_en_patio/' + placaActual).remove();
            
            if (marcadorPropio) { mapa.removeLayer(marcadorPropio); marcadorPropio = null; }
            if (marcadorDestino) { mapa.removeLayer(marcadorDestino); marcadorDestino = null; }
            
            document.getElementById("vista-login").style.display = "block";
            document.getElementById("placa").value = "";
            document.getElementById("posicion").value = "";
            document.getElementById("texto-placa").style.display = "none";
            document.getElementById("cronometro").style.display = "none";
            document.getElementById("cronometro").innerText = "⏱️ Tiempo en terminal: 0 min";
            document.getElementById("btnEmergencia").style.display = "none";
            document.getElementById("btnSalir").style.display = "none";
            
            placaActual = "";
        }

        function pedirAuxilio() {
            if (placaActual !== "") {
                if (confirm("¿Solicitar AUXILIO VIAL? Se alertará a la Torre inmediatamente.")) {
                    db.ref('camiones_en_patio/' + placaActual).update({ estado: 'emergencia' });
                    
                    // CREDENCIALES REALES DE TELEGRAM INTEGRADAS
                    const token = "8515273340:AAHsV3fsue-dY9CZCWlj1izG-usRtgDY64k"; 
                    const chat_id = "-5100426684"; 
                    const textoMsg = `🚨 EMERGENCIA EN PATIO: La unidad ${placaActual} acaba de presionar el botón de Auxilio Vial.`;
                    
                    fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(textoMsg)}`)
                        .catch(error => console.error(error));
                }
            }
        }

        window.addEventListener("beforeunload", function (e) {
            if (placaActual !== "") db.ref('camiones_en_patio/' + placaActual).remove();
        });
    </script>
