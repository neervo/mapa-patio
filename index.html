<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patio YMS - Operador</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg-color: #f4f4f9; --card-bg: white; --text-color: #444; --title-color: #003366; --input-border: #ccc; }
        body.dark-mode { --bg-color: #111; --card-bg: #222; --text-color: #ccc; --title-color: #ffcc00; --input-border: #555; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; position: fixed;}
        
        #mapaFondo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
        .card { background-color: var(--card-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; text-align: center; box-sizing: border-box; }
        .panel-flotante { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: rgba(255,255,255,0.95); padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; text-align: center; box-sizing: border-box; }
        body.dark-mode .panel-flotante { background-color: rgba(34,34,34,0.95); }
        .panel-completo { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; z-index: 10; overflow: hidden;}
        
        h2 { color: var(--title-color); margin-top: 0; margin-bottom: 20px; font-size: 22px; }
        input { width: 100%; font-size: 16px; border: none; border-bottom: 2px solid var(--input-border); margin-bottom: 20px; padding: 10px; text-align: center; font-weight: bold; background: transparent; color: var(--text-color); outline: none; text-transform: uppercase; box-sizing: border-box;}
        button { font-size: 16px; font-weight: bold; border: none; border-radius: 8px; padding: 15px; width: 100%; cursor: pointer; color: white; transition: 0.3s; margin-bottom: 12px; box-sizing: border-box;}
        .btn-gordo { padding: 25px; border-radius: 12px; font-size: 20px; }
        .btn-atras { background-color: #555; padding: 10px; width: auto; align-self: flex-start; margin-bottom: 20px;}
        .btn-entrar { background-color: #003366; }
        .btn-auxilio { background-color: #d32f2f; border-radius: 20px; }
        .btn-salir { background-color: #555; margin-bottom: 0; }

        .texto-placa { font-size: 22px; font-weight: bold; color: var(--title-color); margin-bottom: 10px; }
        .texto-destino { font-size: 18px; font-weight: bold; color: var(--text-color); margin-bottom: 15px; }
        .texto-tiempo { font-size: 18px; color: #4caf50; font-weight: bold; margin-bottom: 20px; }

        #alertaMensaje { display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background-color: #ffcc00; padding: 20px; width: 90%; max-width: 350px; border-radius: 12px; z-index: 100; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); box-sizing: border-box;}
    </style>
</head>
<body>

    <div id="mapaFondo"></div>

    <div id="alertaMensaje">
        <div style="color: #003366; font-weight: bold; font-size:14px;">📩 MENSAJE DE TORRE:</div>
        <div id="textoMensaje" style="font-size: 22px; font-weight: bold; margin: 15px 0; color: #000;"></div>
        <button style="background-color: #2e7d32; padding:10px;" onclick="document.getElementById('alertaMensaje').style.display = 'none';">✅ ENTENDIDO</button>
    </div>

    <div class="card" id="pantallaSeleccion">
        <h2>SELECCIONA TU PERFIL</h2>
        <button class="btn-gordo" style="background-color: #007AFF;" onclick="seleccionarPerfil('FORANEO')">🚚 FORÁNEO</button>
        <button class="btn-gordo" style="background-color: #4caf50;" onclick="seleccionarPerfil('INTERNO')">🚜 INTERNO</button>
    </div>

    <div class="card" id="pantallaLogin" style="display: none;">
        <button class="btn-atras" onclick="volverSeleccion()">⬅ Volver</button>
        <h2 id="tituloLogin">REGISTRO</h2>
        <input type="text" id="placaInput" placeholder="Placa / Num Eco">
        <input type="text" id="posicionInput" placeholder="Posición (Ej. A0 03)">
        <input type="text" id="buqueInput" placeholder="Buque Asignado" style="display:none;">
        <input type="text" id="stsInput" placeholder="Grúa STS" style="display:none;">
        <button class="btn-entrar" id="btnIngresar" onclick="iniciarRastreo()">Ingreso a Patio</button>
    </div>

    <div id="pantallaActiva" style="display: none;">
        <div style="width: 100%; max-width: 400px; text-align: center;">
            <div class="texto-placa" id="lblPlaca">UNIDAD: --</div>
            <div class="texto-destino" id="lblDestino">Destino: --</div>
            <div class="texto-tiempo" id="lblTiempo">⏱️ 0 min</div>
            
            <div id="botoneraInterna" style="display: none; width: 100%;">
                <button id="btnBano" style="background-color: #ff9800;" onclick="toggleBano()">🚾 Ir al Baño</button>
                <button style="background-color: #ff5722;" onclick="cambiarEstado('pager', 'Falla de Pager')">📟 Falla de Pager</button>
            </div>

            <button class="btn-auxilio" onclick="cambiarEstado('emergencia', 'AUXILIO REQUERIDO')">🚨 AUXILIO</button>
            <button class="btn-salir" onclick="salirRastreo()">Cerrar Turno</button>
        </div>
    </div>

    <script>
        const horaActual = new Date().getHours();
        if (horaActual >= 18 || horaActual < 6) { document.body.classList.add('dark-mode'); }

        const firebaseConfig = { apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE", authDomain: "patio-densidad.firebaseapp.com", databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com", projectId: "patio-densidad" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const coordenadasBahias = { "A0 02": [19.0671, -104.2955], "A0 06": [19.0650, -104.2940], "G3 02": [19.0665, -104.2960] };

        // VARIABLES GLOBALES (Incluidas las del Motor Histórico)
        let mapa, marcadorMia, marcadorDestino, watchId = null, wakeLock = null, timerInterval = null;
        let tipoGlobal = "", placaGlobal = "", destinoGlobal = "", buqueGlobal = "", stsGlobal = "";
        let horaIngreso = 0, maxSpeed = 0, ultimoAudio = 0, estadoOperativo = "activo";
        
        let latActual = null, lngActual = null, velActual = 0;
        let historialBatch = [];
        let tracker1Min = null;
        let sender5Min = null;

        mapa = L.map('mapaFondo', { zoomControl: false }).setView([19.066, -104.295], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mapa);

        async function solicitarWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
        function hablar(texto) { if ('speechSynthesis' in window) { window.speechSynthesis.speak(new SpeechSynthesisUtterance(texto)); } }

        function seleccionarPerfil(tipo) {
            tipoGlobal = tipo;
            document.getElementById('pantallaSeleccion').style.display = 'none';
            document.getElementById('pantallaLogin').style.display = 'block';
            document.getElementById('tituloLogin').innerText = "REGISTRO " + tipo;
            
            if(tipo === 'FORANEO') {
                document.getElementById('btnIngresar').innerText = "Ingreso a Patio";
                document.getElementById('placaInput').placeholder = "Placa (Ej. TRACTO-5)";
                document.getElementById('posicionInput').style.display = 'block';
                document.getElementById('buqueInput').style.display = 'none';
                document.getElementById('stsInput').style.display = 'none';
            } else {
                document.getElementById('btnIngresar').innerText = "Iniciar Turno";
                document.getElementById('placaInput').placeholder = "Num Eco (Ej. ECO-12)";
                document.getElementById('posicionInput').style.display = 'none';
                document.getElementById('buqueInput').style.display = 'block';
                document.getElementById('stsInput').style.display = 'block';
            }
        }

        function volverSeleccion() {
            document.getElementById('pantallaSeleccion').style.display = 'block';
            document.getElementById('pantallaLogin').style.display = 'none';
        }

        function iniciarRastreo() {
            placaGlobal = document.getElementById('placaInput').value.trim().toUpperCase();
            if(placaGlobal === "") return alert("Ingresa datos");

            if (tipoGlobal === 'FORANEO') {
                destinoGlobal = document.getElementById('posicionInput').value.trim().toUpperCase();
                document.getElementById('mapaFondo').style.display = 'block';
                setTimeout(() => { mapa.invalidateSize(); }, 300);
                document.getElementById('pantallaActiva').className = 'panel-flotante';
                document.getElementById('botoneraInterna').style.display = 'none';
                document.getElementById('lblDestino').innerText = "Destino: " + destinoGlobal;
                
                if (coordenadasBahias[destinoGlobal]) {
                    if(marcadorDestino) mapa.removeLayer(marcadorDestino);
                    marcadorDestino = L.marker(coordenadasBahias[destinoGlobal]).addTo(mapa).bindPopup("Destino: " + destinoGlobal);
                }
            } else {
                buqueGlobal = document.getElementById('buqueInput').value.trim().toUpperCase();
                stsGlobal = document.getElementById('stsInput').value.trim().toUpperCase();
                document.getElementById('mapaFondo').style.display = 'none';
                document.getElementById('pantallaActiva').className = 'panel-completo';
                document.getElementById('botoneraInterna').style.display = 'block';
                document.getElementById('lblDestino').innerText = "🚢 " + buqueGlobal + " | 🏗️ " + stsGlobal;
                
                // === MOTOR HÍBRIDO DE HISTORIAL (SOLO INTERNOS) ===
                const fechaHoy = new Date().toISOString().split('T')[0]; // Ej. 2026-08-12
                
                // 1. Recolector Local (Cada 1 Minuto)
                tracker1Min = setInterval(() => {
                    if(latActual && lngActual) {
                        historialBatch.push({
                            lat: latActual,
                            lng: lngActual,
                            vel: velActual,
                            est: estadoOperativo,
                            time: Date.now()
                        });
                    }
                }, 60000); 

                // 2. Enviador de Paquetes a Firebase (Cada 5 Minutos)
                sender5Min = setInterval(() => {
                    if (historialBatch.length > 0) {
                        const refHistorial = db.ref(`historial_rutas/${fechaHoy}/${placaGlobal}`);
                        historialBatch.forEach(punto => {
                            refHistorial.push(punto);
                        });
                        historialBatch = []; // Limpiar el paquete ya enviado
                    }
                }, 300000);
            }

            document.getElementById('lblPlaca').innerText = "UNIDAD: " + placaGlobal;
            document.getElementById('pantallaLogin').style.display = 'none';
            document.getElementById('pantallaActiva').style.display = 'flex';
            
            horaIngreso = Date.now();
            estadoOperativo = "activo";
            solicitarWakeLock();
            hablar("Ingreso registrado");

            timerInterval = setInterval(() => {
                if (estadoOperativo === 'activo') {
                    let min = Math.floor((Date.now() - horaIngreso) / 60000);
                    document.getElementById('lblTiempo').innerText = "⏱️ Tiempo: " + min + " min";
                }
            }, 60000);

            db.ref('camiones_en_patio/' + placaGlobal).on('value', snap => {
                const data = snap.val();
                if(data === null) {
                    alert("⚠️ Tu turno ha sido finalizado por la Torre de Control.");
                    window.location.reload();
                    return;
                }

                if (data.tts_mensaje && data.tts_timestamp > ultimoAudio) {
                    ultimoAudio = data.tts_timestamp;
                    document.getElementById('textoMensaje').innerText = `"${data.tts_mensaje}"`;
                    document.getElementById('alertaMensaje').style.display = 'block';
                    hablar(data.tts_mensaje);
                }

                if (data.estado && data.estado !== estadoOperativo) {
                    estadoOperativo = data.estado;
                    if(estadoOperativo === 'activo') {
                        document.getElementById('btnBano').style.backgroundColor = '#ff9800'; 
                        document.getElementById('btnBano').innerText = "🚾 Ir al Baño";
                        let min = Math.floor((Date.now() - horaIngreso) / 60000);
                        document.getElementById('lblTiempo').innerText = "⏱️ Tiempo: " + min + " min";
                    }
                }
            });

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(pos => {
                    latActual = pos.coords.latitude; 
                    lngActual = pos.coords.longitude;
                    velActual = ((pos.coords.speed || 0) * 3.6).toFixed(1);
                    if (parseFloat(velActual) > parseFloat(maxSpeed)) maxSpeed = velActual;

                    if (tipoGlobal === 'FORANEO') {
                        if (marcadorMia) {
                            marcadorMia.setLatLng([latActual, lngActual]);
                        } else {
                            marcadorMia = L.circleMarker([latActual, lngActual], { radius: 8, fillColor: "#007AFF", color: "white", weight: 2, fillOpacity: 1 }).addTo(mapa);
                            mapa.setView([latActual, lngActual], 18);
                        }
                    }

                    // VISTA EN VIVO (Se envía siempre a la torre)
                    db.ref('camiones_en_patio/' + placaGlobal).update({
                        lat: latActual, lng: lngActual, placa: placaGlobal, tipo: tipoGlobal, estado: estadoOperativo,
                        destino: destinoGlobal, buque: buqueGlobal, sts: stsGlobal, hora_ingreso: horaIngreso, velocidad_actual: velActual
                    });
                }, err => {}, { enableHighAccuracy: true, maximumAge: 0 });
            }
        }

        function cambiarEstado(nuevoEstado, msj) {
            estadoOperativo = nuevoEstado;
            db.ref('camiones_en_patio/' + placaGlobal).update({ estado: nuevoEstado });
            fetch(`https://api.telegram.org/bot8515273340:AAHsV3fsue-dY9CZCWlj1izG-usRtgDY64k/sendMessage?chat_id=-1005100426684&text=${encodeURIComponent("⚠️ ALERTA " + placaGlobal + ": " + msj)}`);
        }

        function toggleBano() {
            const btn = document.getElementById('btnBano');
            if (estadoOperativo === 'baño') {
                cambiarEstado('activo', null);
                btn.style.backgroundColor = '#ff9800'; btn.innerText = "🚾 Ir al Baño";
                document.getElementById('lblTiempo').innerText = "⏱️ Tiempo: " + Math.floor((Date.now() - horaIngreso) / 60000) + " min";
            } else {
                cambiarEstado('baño', 'Operador fue al baño');
                btn.style.backgroundColor = '#4caf50'; btn.innerText = "✅ Regresar a Operar";
                document.getElementById('lblTiempo').innerText = "🚾 BAÑO";
            }
        }

        function salirRastreo() {
            if(!confirm("¿Seguro que deseas cerrar tu turno/viaje?")) return;
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (timerInterval) clearInterval(timerInterval);
            if (tracker1Min) clearInterval(tracker1Min);
            if (sender5Min) clearInterval(sender5Min);
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
            
            // Forzar el envío del último paquete local antes de salir
            if(historialBatch.length > 0 && tipoGlobal === 'INTERNO') {
                const fechaHoy = new Date().toISOString().split('T')[0];
                const refHistorial = db.ref(`historial_rutas/${fechaHoy}/${placaGlobal}`);
                historialBatch.forEach(punto => refHistorial.push(punto));
            }

            if (placaGlobal !== "") db.ref('camiones_en_patio/' + placaGlobal).remove();
            window.location.reload(); 
        }
    </script>
</body>
</html>
