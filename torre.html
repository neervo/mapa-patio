<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control - Patio Logística</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; overflow: hidden; }
        #mapa { width: calc(100vw - 320px); height: calc(100vh - 65px); position: absolute; top: 65px; left: 320px; z-index: 1; }
        .header { background-color: rgba(0, 26, 51, 1); color: white; padding: 15px 20px; position: absolute; top: 0; left: 0; width: 100%; height: 65px; z-index: 1000; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ffcc00; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        .panel-derecho { display: flex; gap: 15px; align-items: center; }
        
        .buscador { padding: 8px 15px; border-radius: 20px; border: none; outline: none; font-weight: bold; text-transform: uppercase; width: 150px; text-align: center; }
        .contador { font-size: 16px; font-weight: bold; background: #003366; padding: 8px 15px; border-radius: 20px; }
        .btn-excel { background-color: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-excel:hover { background-color: #1b5e20; }
        
        .emergencia-alerta { color: #ff4d4d; animation: parpadeo 1s infinite; display: none; font-weight: bold; font-size: 18px;}
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        .panel-lateral { width: 320px; height: calc(100vh - 65px); background-color: #222; position: absolute; top: 65px; left: 0; z-index: 100; overflow-y: auto; border-right: 2px solid #444; padding: 10px; box-sizing: border-box; }
        .panel-lateral h2 { color: #ffcc00; font-size: 16px; text-align: center; margin-top: 5px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .tarjeta-unidad { background: #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; border-left: 5px solid #00ff88; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .tarjeta-unidad:hover { background: #444; transform: translateX(3px); }
        .tarjeta-unidad.alerta { border-left: 5px solid #ff0000; background: #551a1a; animation: parpadeo 1.5s infinite; }
        .tarjeta-unidad .placa { font-size: 16px; font-weight: bold; margin-bottom: 5px; display:flex; justify-content: space-between;}
        .tarjeta-unidad .datos { font-size: 12px; color: #ccc; display: flex; justify-content: space-between; margin-top: 5px;}
        
        .input-tts { width: 100%; padding: 8px; margin-bottom: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 14px;}
        .btn-radio { background-color: #ff9800; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-resolver { background-color: #2e7d32; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px;}
        .btn-eliminar { background-color: #555; color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 5px; font-size: 12px; }
        
        .tiempo-info { background-color: #e3f2fd; padding: 8px; border-radius: 5px; margin-bottom: 10px; font-size: 13px; color: #003366; text-align: left;}
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    </style>
</head>
<body>
    <audio id="sonidoAlerta" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <div class="header">
        <h1>📡 TORRE YMS</h1>
        <div id="alertaGlobal" class="emergencia-alerta">🚨 ¡EMERGENCIA ACTIVA! 🚨</div>
        <div class="panel-derecho">
            <button class="btn-excel" onclick="exportarExcel()">📊 Descargar Reporte</button>
            <input type="text" id="buscadorPlaca" class="buscador" placeholder="Buscar Placa...">
            <div class="contador">Unidades: <span id="contadorCamiones">0</span></div>
        </div>
    </div>
    
    <div id="panelLateral" class="panel-lateral">
        <h2>Unidades en Patio</h2>
        <div id="listaUnidades"></div>
    </div>

    <div id="mapa"></div>

    <script>
        const mapa = L.map('mapa').setView([19.066, -104.295], 16);
        const capaCalles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        const capaSatelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
        capaSatelite.addTo(mapa);
        L.control.layers({"Satelital": capaSatelite, "Calles": capaCalles}).addTo(mapa);

        // Geocerca (Solo dibujada)
        const COORDENADAS_POLIGONO = [
            [19.070, -104.300], [19.070, -104.290], [19.060, -104.290], [19.060, -104.300]
        ];
        L.polygon(COORDENADAS_POLIGONO, {color: 'red', fillColor: '#ff0000', fillOpacity: 0.1, weight: 2}).addTo(mapa);

        const firebaseConfig = { apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE", authDomain: "patio-densidad.firebaseapp.com", databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com", projectId: "patio-densidad" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const marcadoresCamiones = {};
        const alertaGlobal = document.getElementById('alertaGlobal');
        const contadorDisplay = document.getElementById('contadorCamiones');
        const listaUnidades = document.getElementById('listaUnidades');
        let estadoEmergenciaAnterior = false;

        // =====================================
        // GENERADOR DE REPORTES (EXCEL / CSV)
        // =====================================
        window.exportarExcel = function() {
            db.ref('historial_viajes').once('value').then(snapshot => {
                const data = snapshot.val();
                if(!data) { alert("Aún no hay historial de viajes completados."); return; }
                
                let csvContent = "data:text/csv;charset=utf-8,Placa,Destino,Fecha,Hora_Ingreso,Hora_Salida,Minutos_Totales,Velocidad_Max_Kmh\n";
                
                for(const key in data) {
                    const viaje = data[key];
                    const fIngreso = new Date(viaje.hora_ingreso);
                    const fSalida = new Date(viaje.hora_salida);
                    const fechaStr = fIngreso.toLocaleDateString('es-MX');
                    const hIngresoStr = fIngreso.toLocaleTimeString('es-MX');
                    const hSalidaStr = fSalida.toLocaleTimeString('es-MX');
                    const minutos = Math.floor((viaje.hora_salida - viaje.hora_ingreso) / 60000);
                    
                    csvContent += `${viaje.placa},${viaje.destino},${fechaStr},${hIngresoStr},${hSalidaStr},${minutos},${viaje.velocidad_maxima}\n`;
                }
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Reporte_YMS_${new Date().toLocaleDateString('es-MX')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        };

        window.enfocarCamion = function(placa) { if (marcadoresCamiones[placa]) { mapa.setView(marcadoresCamiones[placa].getLatLng(), 19); marcadoresCamiones[placa].openPopup(); } };

        window.enviarTexto = function(placa) {
            const input = document.getElementById('tts-' + placa);
            if(!input) return;
            const texto = input.value.trim();
            if (texto !== "") {
                db.ref('camiones_en_patio/' + placa).update({ tts_mensaje: texto, tts_timestamp: Date.now() });
                input.value = ""; 
                const btn = document.getElementById('btn-radio-' + placa);
                if(btn) { btn.innerText = "✅ Enviado"; btn.style.backgroundColor = "#4caf50"; setTimeout(() => { btn.innerText = "🗣️ Enviar por Radio"; btn.style.backgroundColor = "#ff9800"; }, 2000); }
            }
        };

        window.marcarResuelto = function(placa) { db.ref('camiones_en_patio/' + placa).update({ estado: 'normal' }); mapa.closePopup(); };
        
        window.forzarSalida = function(placa) { 
            if(confirm("¿Forzar salida de " + placa + "?")) { 
                db.ref('camiones_en_patio/' + placa).once('value').then(snap => {
                    const info = snap.val();
                    if(info) {
                        // Guardar en historial antes de borrar
                        db.ref('historial_viajes').push({
                            placa: info.placa, destino: info.destino || 'S/D', 
                            hora_ingreso: info.hora_ingreso || Date.now(), hora_salida: Date.now(), 
                            velocidad_maxima: info.velocidad_maxima || 0
                        });
                    }
                    db.ref('camiones_en_patio/' + placa).remove(); 
                    mapa.closePopup(); 
                });
            } 
        };

        const camionesRef = db.ref('camiones_en_patio');
        camionesRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            let hayEmergenciaActual = false;
            let totalCamiones = 0;
            let htmlLista = ""; 

            for (const placa in data) {
                totalCamiones++;
                const camion = data[placa];
                const latlng = [camion.lat, camion.lng];
                const esEmergencia = camion.estado === "emergencia";
                const colorPunto = esEmergencia ? "#ff0000" : "#00ff88"; 
                if (esEmergencia) hayEmergenciaActual = true;

                let minutosAdentro = 0;
                let infoTiempo = "Sin registro";
                if(camion.hora_ingreso) {
                    const fechaIngreso = new Date(camion.hora_ingreso);
                    minutosAdentro = Math.floor((Date.now() - camion.hora_ingreso) / 60000);
                    infoTiempo = `<b>Ingreso:</b> ${fechaIngreso.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}<br><b>Tiempo en patio:</b> ${minutosAdentro} min`;
                }

                const destinoDisplay = camion.destino ? camion.destino : "Sin ruta";
                const velocidadActual = camion.velocidad_actual || 0;

                htmlLista += `
                    <div class="tarjeta-unidad ${esEmergencia ? 'alerta' : ''}" onclick="enfocarCamion('${placa}')">
                        <div class="placa">
                            <span>${esEmergencia ? '🚨' : '✅'} ${placa}</span>
                            <span style="font-size: 12px; color: ${velocidadActual > 15 ? '#ff4d4d' : '#00ff88'};">🏎️ ${velocidadActual} km/h</span>
                        </div>
                        <div class="datos">
                            <span>📍 ${destinoDisplay}</span>
                            <span>⏱️ ${minutosAdentro} min</span>
                        </div>
                    </div>`;

                const divTiempoActivo = document.getElementById('tiempo-info-' + placa);
                if (divTiempoActivo) { divTiempoActivo.innerHTML = infoTiempo; }

                let contenidoPopup = `<div style="text-align: center; min-width: 200px;"><b style="font-size:16px;">UNIDAD: ${placa}</b><br><br><div id="tiempo-info-${placa}" class="tiempo-info">${infoTiempo}</div><input type="text" id="tts-${placa}" class="input-tts" placeholder="Escribe instrucción aquí..."><button id="btn-radio-${placa}" class="btn-radio" onclick="enviarTexto('${placa}')">🗣️ Enviar por Radio</button>`;
                if (esEmergencia) contenidoPopup += `<div style="border-top: 1px solid #ccc; padding-top: 10px;"><b style="color:red;">🚨 EMERGENCIA 🚨</b><button class="btn-resolver" onclick="marcarResuelto('${placa}')">✅ Marcar Resuelto</button></div>`;
                contenidoPopup += `<button class="btn-eliminar" onclick="forzarSalida('${placa}')">🗑️ Forzar Salida</button></div>`;

                if (marcadoresCamiones[placa]) {
                    marcadoresCamiones[placa].setLatLng(latlng);
                    if (marcadoresCamiones[placa].estadoGuardado !== camion.estado) { marcadoresCamiones[placa].bindPopup(contenidoPopup); marcadoresCamiones[placa].estadoGuardado = camion.estado; marcadoresCamiones[placa].setStyle({ fillColor: colorPunto }); }
                    if(esEmergencia && !marcadoresCamiones[placa].isPopupOpen()) marcadoresCamiones[placa].openPopup();
                } else {
                    marcadoresCamiones[placa] = L.circleMarker(latlng, { radius: 10, fillColor: colorPunto, color: "#ffffff", weight: 2, fillOpacity: 0.9 }).addTo(mapa);
                    marcadoresCamiones[placa].bindPopup(contenidoPopup);
                    marcadoresCamiones[placa].estadoGuardado = camion.estado;
                }
            }

            listaUnidades.innerHTML = htmlLista;
            contadorDisplay.innerText = totalCamiones;
            alertaGlobal.style.display = hayEmergenciaActual ? "block" : "none";
            
            for (const placa in marcadoresCamiones) { if (!data[placa]) { mapa.removeLayer(marcadoresCamiones[placa]); delete marcadoresCamiones[placa]; } }
            if (hayEmergenciaActual && !estadoEmergenciaAnterior) document.getElementById('sonidoAlerta').play().catch(e => {});
            estadoEmergenciaAnterior = hayEmergenciaActual;
        });

        document.getElementById('buscadorPlaca').addEventListener('input', function(e) {
            const texto = e.target.value.toUpperCase();
            if (texto !== "" && marcadoresCamiones[texto]) { mapa.setView(marcadoresCamiones[texto].getLatLng(), 19); marcadoresCamiones[texto].openPopup(); }
        });
    </script>
</body>
</html>
