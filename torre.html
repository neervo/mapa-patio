<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control - Patio Logística</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; }
        #mapa { width: 100vw; height: 100vh; z-index: 1; }
        
        .header {
            background-color: #001a33;
            color: white; padding: 15px 20px; position: fixed; top: 0; left: 0;
            width: 100%; z-index: 1000; box-sizing: border-box; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 3px solid #ffcc00;
        }
        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .contador { font-size: 16px; font-weight: bold; background: #003366; padding: 5px 15px; border-radius: 20px; }
        .emergencia-alerta { color: #ff4d4d; animation: parpadeo 1s infinite; display: none; font-weight: bold; }
        
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 TORRE DE CONTROL YMS</h1>
        <div id="alertaGlobal" class="emergencia-alerta">🚨 ¡EMERGENCIA ACTIVA EN PATIO! 🚨</div>
        <div class="contador">Unidades en Patio: <span id="contadorCamiones">0</span></div>
    </div>

    <div id="mapa"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // MISMAS LLAVES DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE",
            authDomain: "patio-densidad.firebaseapp.com",
            databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com",
            projectId: "patio-densidad",
            storageBucket: "patio-densidad.firebasestorage.app",
            messagingSenderId: "530029167611",
            appId: "1:530029167611:web:f5cbcb021aebd05298415e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // INICIALIZAR MAPA (Vista amplia para la computadora)
        const mapa = L.map('mapa').setView([19.066, -104.295], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapa);

        // DICCIONARIO PARA GUARDAR LOS PUNTOS DEL MAPA
        const marcadoresCamiones = {};
        const alertaGlobal = document.getElementById('alertaGlobal');
        const contadorDisplay = document.getElementById('contadorCamiones');

        // ESCUCHAR LA BASE DE DATOS EN TIEMPO REAL
        const camionesRef = ref(db, 'camiones_en_patio');
        
        onValue(camionesRef, (snapshot) => {
            const data = snapshot.val() || {};
            let hayEmergencia = false;
            let totalCamiones = 0;

            // 1. Dibujar o mover camiones activos
            for (const placa in data) {
                totalCamiones++;
                const camion = data[placa];
                const latlng = [camion.lat, camion.lng];
                const esEmergencia = camion.estado === "emergencia";
                const colorPunto = esEmergencia ? "#ff0000" : "#00ff88"; // Rojo alerta, Verde normal
                
                if (esEmergencia) hayEmergencia = true;

                if (marcadoresCamiones[placa]) {
                    // Si ya existe, solo lo movemos de lugar y actualizamos color
                    marcadoresCamiones[placa].setLatLng(latlng);
                    marcadoresCamiones[placa].setStyle({ fillColor: colorPunto });
                    
                    if(esEmergencia) {
                        marcadoresCamiones[placa].bindPopup(`<b>🚨 EMERGENCIA: ${placa} 🚨</b>`).openPopup();
                    }
                } else {
                    // Si es nuevo (acaba de escanear el QR), lo creamos
                    marcadoresCamiones[placa] = L.circleMarker(latlng, {
                        radius: 10,
                        fillColor: colorPunto,
                        color: "#ffffff",
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(mapa).bindPopup(`<b>Unidad: ${placa}</b>`);
                }
            }

            // 2. Limpiar camiones que ya salieron (cerraron su página)
            for (const placa en marcadoresCamiones) {
                if (!data[placa]) {
                    mapa.removeLayer(marcadoresCamiones[placa]); // Lo quitamos del mapa
                    delete marcadoresCamiones[placa]; // Lo quitamos de la memoria
                }
            }

            // 3. Actualizar panel visual
            contadorDisplay.innerText = totalCamiones;
            alertaGlobal.style.display = hayEmergencia ? "block" : "none";
        });
    </script>
</body>
</html>
