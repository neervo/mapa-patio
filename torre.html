<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Control - Patio YMS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; overflow: hidden; }
        #mapa { width: calc(100vw - 320px); height: calc(100vh - 65px); position: absolute; top: 65px; left: 320px; z-index: 1; }
        
        .header { background-color: #001a33; color: white; padding: 15px; position: absolute; top: 0; left: 0; width: 100%; height: 65px; z-index: 1000; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #ffcc00; }
        .contador { font-size: 16px; font-weight: bold; background: #003366; padding: 8px 15px; border-radius: 20px; margin-right: 20px;}
        
        .panel-lateral { width: 320px; height: calc(100vh - 65px); background-color: #222; position: absolute; top: 65px; left: 0; z-index: 100; display: flex; flex-direction: column;}
        
        .lista-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        .lista-scroll h2 { color: #ffcc00; font-size: 16px; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0;}
        
        .panel-acciones { background-color: #111; padding: 15px; border-top: 2px solid #ffcc00; display: none; flex-direction: column; }
        .panel-acciones h3 { color: white; font-size: 16px; margin: 0 0 10px 0; text-align: center; }
        .input-tts { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #555; background: #333; color: white; box-sizing: border-box;}
        .btn-radio { background-color: #ff9800; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-resolver { background-color: #2e7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        .btn-eliminar { background-color: #d32f2f; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        .tarjeta-unidad { background: #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .tarjeta-unidad.interno { border-left: 5px solid #4caf50; } 
        .tarjeta-unidad.foraneo { border-left: 5px solid #007AFF; } 
        .tarjeta-unidad.seleccionada { border: 2px solid white; background: #444;}
        
        .tarjeta-unidad.alerta-emergencia { border-left: 5px solid #ff0000; background: #551a1a; animation: parpadeo 1s infinite; }
        .tarjeta-unidad.alerta-pager { border-left: 5px solid #ff5722; background: #4a2311; }
        .tarjeta-unidad.alerta-bano { border-left: 5px solid #b38f00; background: #4a4a11; }
        
        @keyframes parpadeo { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .placa { font-size: 16px; font-weight: bold; margin-bottom: 5px; display:flex; justify-content: space-between;}
        .datos { font-size: 12px; color: #ccc; display: flex; justify-content: space-between; margin-top: 5px;}
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 TORRE YMS</h1>
        <div class="contador">Unidades: <span id="contadorCamiones">0</span></div>
    </div>
    
    <div class="panel-lateral">
        <div class="lista-scroll">
            <h2>Unidades en Patio</h2>
            <div id="listaUnidades"></div>
        </div>
        
        <div id="panelAcciones" class="panel-acciones">
            <h3 id="tituloAccion">Selecciona Unidad</h3>
            <input type="text" id="inputVoz" class="input-tts" placeholder="Escribe mensaje a enviar...">
            <button class="btn-radio" onclick="enviarMensajeTorre()">🗣️ Enviar Audio al Operador</button>
            <button id="btnResolverAlerta" class="btn-resolver" style="display:none;" onclick="resolverAlertaTorre()">✅ Resolver Alerta</button>
            <button class="btn-eliminar" onclick="forzarSalidaTorre()">🛑 Finalizar Viaje Forzado</button>
        </div>
    </div>

    <div id="mapa"></div>

    <script>
        const mapa = L.map('mapa').setView([19.066, -104.295], 16);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mapa);

        const firebaseConfig = { apiKey: "AIzaSyAH7D-sLL4fCJDliP8xzuYUQGt-H5H7nXE", authDomain: "patio-densidad.firebaseapp.com", databaseURL: "https://patio-densidad-default-rtdb.firebaseio.com", projectId: "patio-densidad" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const marcadoresCamiones = {};
        const listaUnidades = document.getElementById('listaUnidades');
        
        let camionSeleccionado = null;

        window.seleccionarCamion = function(placa, estado) {
            camionSeleccionado = placa;
            if (marcadoresCamiones[placa]) mapa.setView(marcadoresCamiones[placa].getLatLng(), 18);
            
            const panel = document.getElementById('panelAcciones');
            panel.style.display = 'flex';
            document.getElementById('tituloAccion').innerText = "Acciones: " + placa;
            
            if (estado !== 'activo') {
                document.getElementById('btnResolverAlerta').style.display = 'block';
                document.getElementById('btnResolverAlerta').innerText = `✅ Resolver (${estado.toUpperCase()})`;
            } else {
                document.getElementById('btnResolverAlerta').style.display = 'none';
            }
            renderLista();
        };

        window.enviarMensajeTorre = function() {
            const input = document.getElementById('inputVoz');
            if (camionSeleccionado && input.value.trim() !== "") {
                db.ref('camiones_en_patio/' + camionSeleccionado).update({ tts_mensaje: input.value.trim(), tts_timestamp: Date.now() });
                input.value = ""; 
                alert("Mensaje enviado a " + camionSeleccionado);
            }
        };

        window.resolverAlertaTorre = function() {
            if (camionSeleccionado) {
                db.ref('camiones_en_patio/' + camionSeleccionado).update({ estado: 'activo' });
                document.getElementById('btnResolverAlerta').style.display = 'none';
            }
        };

        // NUEVO BOTÓN: ELIMINAR TRACTO DESDE LA TORRE
        window.forzarSalidaTorre = function() {
            if (camionSeleccionado) {
                if(confirm("¿Seguro que deseas FINALIZAR el viaje de " + camionSeleccionado + "? Se borrará del patio.")) {
                    db.ref('camiones_en_patio/' + camionSeleccionado).remove();
                    document.getElementById('panelAcciones').style.display = 'none';
                    camionSeleccionado = null;
                }
            }
        };

        let dataGlobal = {};

        function renderLista() {
            let htmlLista = ""; 
            let totalUnidades = 0;

            for (const placa in dataGlobal) {
                totalUnidades++;
                const camion = dataGlobal[placa];
                const tipo = camion.tipo || 'FORANEO';
                const estado = camion.estado || 'activo';
                
                let claseCSS = tipo === 'INTERNO' ? 'interno' : 'foraneo';
                let iconoLateral = tipo === 'INTERNO' ? '🚜' : '🚚';

                if (estado === 'emergencia') { claseCSS = 'alerta-emergencia'; iconoLateral = '🚨';}
                else if (estado === 'pager') { claseCSS = 'alerta-pager'; iconoLateral = '📟';}
                else if (estado === 'baño') { claseCSS = 'alerta-bano'; iconoLateral = '🚾';}

                if (placa === camionSeleccionado) claseCSS += ' seleccionada';

                let infoRuta = tipo === 'FORANEO' ? `📍 ${camion.destino || 'S/D'}` : `🚢 ${camion.buque} | 🏗️ ${camion.sts}`;
                let tiempo = estado === 'baño' ? "🚾 BAÑO" : `⏱️ ${Math.floor((Date.now() - (camion.hora_ingreso||Date.now())) / 60000)} min`;

                htmlLista += `
                    <div class="tarjeta-unidad ${claseCSS}" onclick="seleccionarCamion('${placa}', '${estado}')">
                        <div class="placa"><span>${iconoLateral} ${placa}</span><span>🏎️ ${camion.velocidad_actual||0} km/h</span></div>
                        <div class="datos"><span>${infoRuta}</span><span>${tiempo}</span></div>
                    </div>`;
            }
            listaUnidades.innerHTML = htmlLista;
            document.getElementById('contadorCamiones').innerText = totalUnidades;
        }

        db.ref('camiones_en_patio').on('value', (snapshot) => {
            dataGlobal = snapshot.val() || {};
            
            for (const placa in dataGlobal) {
                const camion = dataGlobal[placa];
                const latlng = [camion.lat, camion.lng];
                const tipo = camion.tipo || 'FORANEO';
                const estado = camion.estado || 'activo';

                // LÓGICA DE COLORES DE LOS PUNTOS
                let colorPunto = tipo === 'INTERNO' ? '#4caf50' : '#007AFF'; // Verde o Azul
                if (estado === 'emergencia') colorPunto = '#ff0000';
                else if (estado === 'pager') colorPunto = '#ff5722';
                else if (estado === 'baño') colorPunto = '#ffcc00';

                if (marcadoresCamiones[placa]) {
                    marcadoresCamiones[placa].setLatLng(latlng);
                    if (marcadoresCamiones[placa].estadoGuardado !== estado) {
                        marcadoresCamiones[placa].setStyle({ fillColor: colorPunto });
                        marcadoresCamiones[placa].estadoGuardado = estado;
                        if(camionSeleccionado === placa) seleccionarCamion(placa, estado);
                    }
                } else {
                    // CÍRCULOS LIMPIOS Y SENCILLOS
                    marcadoresCamiones[placa] = L.circleMarker(latlng, { radius: 9, fillColor: colorPunto, color: "white", weight: 2, fillOpacity: 1 }).addTo(mapa);
                    marcadoresCamiones[placa].on('click', () => seleccionarCamion(placa, estado));
                    marcadoresCamiones[placa].estadoGuardado = estado;
                }
            }

            for (const placa in marcadoresCamiones) {
                if (!dataGlobal[placa]) { 
                    mapa.removeLayer(marcadoresCamiones[placa]); 
                    delete marcadoresCamiones[placa]; 
                    if(camionSeleccionado === placa) {
                        camionSeleccionado = null;
                        document.getElementById('panelAcciones').style.display = 'none';
                    }
                }
            }
            renderLista();
        });
    </script>
</body>
</html>
